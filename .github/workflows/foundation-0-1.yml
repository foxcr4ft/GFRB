name: Foundation 0.1

on:
  pull_request:
    paths:
      - ".github/workflows/foundation-0-1.yml"
      - "default.project.json"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - implementation/foundation-0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Luau tests and Rojo build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lune 0.11.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lune-0.11.1-linux-x86_64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip" \
            --output "$archive"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/lune"
          unzip -q "$archive" -d "$RUNNER_TEMP/lune"
          lune_bin="$(find "$RUNNER_TEMP/lune" -type f -name lune -print -quit)"
          test -n "$lune_bin"
          chmod +x "$lune_bin"
          echo "$(dirname "$lune_bin")" >> "$GITHUB_PATH"

      - name: Install Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rojo-7.7.1-linux-x86_64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip" \
            --output "$archive"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/rojo"
          unzip -q "$archive" -d "$RUNNER_TEMP/rojo"
          rojo_bin="$(find "$RUNNER_TEMP/rojo" -type f -name rojo -print -quit)"
          test -n "$rojo_bin"
          chmod +x "$rojo_bin"
          echo "$(dirname "$rojo_bin")" >> "$GITHUB_PATH"

      - name: Run Luau contract tests and syntax checks
        run: lune run tests/run.luau

      - name: Build Rojo project
        run: rojo build default.project.json --output "$RUNNER_TEMP/Aethermoor.rbxlx"
